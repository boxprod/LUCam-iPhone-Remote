<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCam iPhone Remote</title>
<style>
:root {
	--bg: #0d0e10;
	--panel: #16181b;
	--panel-2: #1d2024;
	--line: #2a2e34;
	--text: #e7e9ec;
	--muted: #8b929c;
	--accent: #f0a429;
	--ok: #3fcf73;
	--warn: #f0a429;
	--rec: #e8322b;
	--rec-dim: #5a1714;
	--radius: 6px;
	/* minimums add up (with gaps and padding) to .table's min-width, which fits a 1440 px window */
	--cols: 34px minmax(182px, 1.6fr) 54px 58px minmax(130px, 1fr) 78px 78px 78px 78px 84px 96px 80px minmax(120px, .9fr) 84px 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
button, input { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .02em; }
header .sub { color: var(--muted); }
header .spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--rec); }
.dot.wait { background: var(--warn); }

a.btn { text-decoration: none; color: var(--text); }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #3c424a; background: #23272c; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
.btn.icon { padding: 4px 8px; }
.btn.rec { min-width: 84px; font-weight: 700; letter-spacing: .06em; }
.btn.rec .led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); margin-right: 7px; vertical-align: -1px; }
.btn.rec.on { background: var(--rec); border-color: var(--rec); color: #fff; }
.btn.rec.on .led { background: #fff; }
.btn.rec.pending { animation: pulse .6s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
.btn.big { padding: 9px 18px; font-size: 14px; }
.btn.stop { min-width: 84px; font-weight: 700; letter-spacing: .06em; }

main { padding: 12px 16px 40px; }
.table { min-width: 1404px; }
.scroll { overflow-x: auto; }
.row { display: grid; grid-template-columns: var(--cols); gap: 6px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 6px; }
.row.head { background: none; border: none; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding-top: 0; padding-bottom: 2px; margin-bottom: 2px; }
.row.global { background: #1a1712; border-color: #4a3a1c; }
.row.global .label { color: var(--accent); font-weight: 650; }
.row.cam.offline { opacity: .55; }
.row.cam.inactive .ctl { opacity: .75; }
.row.cam.recording { border-color: var(--rec); box-shadow: inset 4px 0 0 var(--rec), 0 0 0 1px var(--rec-dim); }
.camname { display: flex; flex-direction: column; min-width: 0; }
.camname .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
.camname input { background: none; border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; margin-left: -5px; font-weight: 600; min-width: 0; width: 100%; }
.camname input:hover { border-color: var(--line); }
.camname input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.camname .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.camname .err { color: #ff8a80; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.arm { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: grid; place-items: center; padding: 0; }
.arm.on { background: var(--accent); border-color: var(--accent); }
.arm.on::after { content: ""; width: 10px; height: 6px; border: solid #111; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
.arm.some { background: var(--accent); border-color: var(--accent); }
.arm.some::after { content: ""; width: 10px; height: 2px; background: #111; }

.combo { position: relative; display: flex; }
.combo input { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius) 0 0 var(--radius); padding: 5px 6px; text-align: right; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.combo input:focus { outline: none; border-color: var(--accent); }
.combo.pending input { color: var(--warn); }
.combo.held input { box-shadow: inset 2px 0 0 var(--accent); }
.combo.disabled { opacity: .35; pointer-events: none; }
.combo .drop { border: 1px solid var(--line); border-left: none; background: var(--panel-2); border-radius: 0 var(--radius) var(--radius) 0; width: 20px; padding: 0; cursor: pointer; color: var(--muted); font-size: 10px; }
.combo .drop:hover { color: var(--text); }
.combo.noopts input { border-radius: var(--radius); }
.combo.noopts .drop { display: none; }
.menu { position: fixed; z-index: 50; background: var(--panel-2); border: 1px solid #3a3f46; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 320px; overflow-y: auto; min-width: 90px; padding: 4px; }
.menu div { padding: 5px 10px; border-radius: 4px; cursor: pointer; text-align: right; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: nowrap; }
.menu div:hover { background: #2c3137; }
.menu div.cur { color: var(--accent); }
.menu div.txt { text-align: left; font-family: inherit; }

.tc { display: flex; flex-direction: column; font-size: 12px; min-width: 0; }
.tc .clip { color: var(--muted); font-size: 11px; line-height: 1.3; overflow-wrap: anywhere; }
.recall { display: flex; gap: 6px; }

.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px; margin-top: 14px; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.addbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.addbar input { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
.addbar input:focus { outline: none; border-color: var(--accent); }
.addbar .addr { width: 240px; }
.addbar .nm { width: 160px; }
.addbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
.found { margin-top: 10px; display: grid; gap: 6px; }
.found .item { display: flex; align-items: center; gap: 12px; padding: 6px 8px; background: var(--panel-2); border-radius: var(--radius); }
.found .item .grow { flex: 1; min-width: 0; }
.found .item .meta { color: var(--muted); font-size: 11px; }
.hint { color: var(--muted); font-size: 12px; }
#netPanel select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; min-width: 340px; }
.netinfo { display: grid; gap: 6px; margin-top: 10px; font-size: 12px; }
.netinfo > div { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.netinfo .k { color: var(--muted); min-width: 230px; }
#netUrls, #netCams { display: inline-flex; flex-wrap: wrap; gap: 6px 18px; }
.netinfo a { color: var(--text); }
.netinfo .warn { color: var(--warn); }
.empty { text-align: center; padding: 28px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 6px; z-index: 60; max-width: 420px; }
.toast { background: #2a1513; border: 1px solid #6b2420; color: #ffd0cc; padding: 8px 12px; border-radius: var(--radius); font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.info { background: var(--panel-2); border-color: var(--line); color: var(--text); }

.tools { display: flex; gap: 4px; }
.chev { width: 18px; height: 18px; flex: none; padding: 0; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 11px; transition: transform .15s; }
.chev:hover { color: var(--text); }
.chev.open { transform: rotate(90deg); color: var(--accent); }
.expand { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 4px -10px -8px; padding: 10px 14px 10px 52px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 var(--radius) var(--radius); }
.expand[hidden] { display: none; }
.expand .grp { display: flex; align-items: center; gap: 8px; }
.expand .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.expand input[type=range] { width: 320px; accent-color: var(--accent); }
.expand input[type=range]:disabled { opacity: .35; }
.expand .val { min-width: 44px; text-align: right; }
.expand .sep { width: 1px; height: 22px; background: var(--line); }
.expand .note { color: var(--muted); font-size: 11px; }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; }
.switch::before { content: ""; width: 28px; height: 16px; border-radius: 999px; background: #3a3f46 radial-gradient(circle at 8px 50%, #c9ced6 5px, transparent 5.5px); }
.switch.on::before { background: var(--ok) radial-gradient(circle at 20px 50%, #fff 5px, transparent 5.5px); }
.switch:disabled { opacity: .35; cursor: default; }
/* on/off switches flip on click, pulse until the camera confirms, then flash
   green; if the command didn't pass they shake and go back */
.switch.sending, .btn.lock.sending { animation: sending 0.9s ease-in-out infinite; }
.switch.confirmed, .btn.lock.confirmed { animation: confirmed 0.7s ease-out; }
.switch.failed, .btn.lock.failed { animation: failed 0.5s ease-in-out; border-color: var(--rec); }
@keyframes sending { 50% { opacity: .55; } }
@keyframes confirmed { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 60%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
@keyframes failed { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
.btn.lock.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
.expand select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 6px; max-width: 220px; }
.expand .row-break { flex-basis: 100%; height: 0; }
.fmt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius); padding: 3px 7px; cursor: pointer; }
.fmt:hover { border-color: #3c424a; }
.fmt:disabled { opacity: .35; cursor: default; }
.fmt .main { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fmt .note { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fmt.live { border-color: #4a3a1c; }
.fmt.live .note { color: var(--accent); }
.fmtpanel { position: fixed; z-index: 50; background: var(--panel-2); border: 1px solid #3a3f46; border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.5); padding: 12px; width: 280px; display: grid; gap: 10px; }
.fmtpanel label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.fmtpanel select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 6px; text-transform: none; letter-spacing: 0; }
.fmtpanel .hint { font-size: 11px; color: var(--muted); }
.fmtpanel .hint.live { color: var(--accent); }
.fmtpanel .buttons { display: flex; justify-content: flex-end; gap: 6px; }
.btn.icon.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu .hdr { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; text-align: left; font-family: inherit; cursor: default; padding: 4px 10px 2px; }
.menu .hdr:hover { background: none; }
.menu .x { color: var(--muted); margin-left: 10px; }
</style>
</head>
<body>
<header>
	<h1>LUCam iPhone Remote</h1>
	<span class="sub" id="summary">–</span>
	<span class="conn"><span class="dot" id="connDot"></span><span id="connText">connecting…</span></span>
	<span class="spacer"></span>
	<button class="btn" id="stopLive" title="Cut every live feed and restore each camera's real recording format (ProRes, 4K…)" disabled>■ Stop all lives</button>
	<a class="btn" href="/live" target="lucam-multiview">Multiview</a>
	<button class="btn rec big" id="recAll"><span class="led"></span>REC ALL</button>
	<button class="btn stop big" id="stopAll">■ STOP ALL</button>
</header>

<main>
	<div class="scroll">
		<div class="table">
			<div class="row head">
				<div></div><div>Camera</div><div>Cam</div><div>Reel</div><div>Format</div><div>Lens mm</div><div>Iris</div><div>ISO</div><div>FPS</div><div>Shutter</div><div>WB K</div><div>Tint</div><div title="Timecode / next clip">TC / next clip</div><div></div><div></div>
			</div>
			<div class="row global" id="globalRow"></div>
			<div id="camRows"></div>
			<div class="empty" id="emptyMsg" hidden>No cameras yet. Add one by IP below, or discover them on the network.</div>
		</div>
	</div>

	<section class="panel">
		<h2>Add cameras</h2>
		<div class="addbar">
			<input class="addr" id="addAddr" placeholder="iPhone IP, e.g. 192.168.1.42 (uses https :4444)" autocomplete="off" spellcheck="false">
			<input class="nm" id="addName" placeholder="Name (optional)" autocomplete="off">
			<button class="btn primary" id="addBtn">Add</button>
			<span class="sep"></span>
			<button class="btn" id="discBtn">Discover (Bonjour)</button>
			<button class="btn" id="scanBtn">Scan subnet</button>
			<span class="hint" id="discStatus"></span>
		</div>
		<div class="found" id="found"></div>
	</section>

	<section class="panel" id="netPanel">
		<h2>Network</h2>
		<div class="addbar">
			<select id="netSelect" title="Network interface used for discovery and for the live view address"></select>
			<button class="btn" id="netRefresh" title="Look for network interfaces again (e.g. after plugging in an adapter)">↻ Refresh</button>
			<span class="hint" id="netHint"></span>
		</div>
		<div class="netinfo">
			<div><span class="k">Control panel from other devices</span><span id="netUrls"></span></div>
			<div><span class="k">Cameras reached via</span><span id="netCams"></span></div>
		</div>
	</section>
</main>

<div class="toasts" id="toasts"></div>

<script>
'use strict';
const PARAMS = {
	letter: { width: 'letter', text: true },
	reel:   { step: 1 },
	lens:   { step: 1, opts: 'lensOptions' },
	iris:   { opts: 'irisOptions' },
	iso:    { opts: 'isoOptions' },
	fps:    { opts: 'fpsOptions' },
	shutter:{ opts: 'shutterOptions' },
	wb:     { step: 100, presets: [2700, 3200, 4000, 4300, 5000, 5600, 6500, 7500] },
	tint:   { step: 1, presets: [-20, -10, 0, 10, 20] },
};
const GLOBAL_PARAMS = ['reel', 'lens', 'iris', 'iso', 'fps', 'shutter', 'wb', 'tint'];
const UNSUPPORTED_KEY = { letter: 'slate', reel: 'slate' };

let state = { cameras: [], global: {}, discovery: { results: [] } };
const pending = {};   // "camId:param" -> {value, until}
const toggles = {};   // "camId:key" -> {value, since, until, failed}: switches sent, not confirmed yet
const rows = new Map();
let openMenu = null;

// ---------------------------------------------------------------- api
async function api(path, body) {
	const opts = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
	const res = await fetch('/api' + path, opts);
	const data = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(data.error || res.statusText);
	return data;
}
function act(path, body) { return api(path, body || {}).catch(e => toast(e.message)); }

// ---------------------------------------------------------------- helpers
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
function toast(msg, kind) {
	const t = el('div', 'toast' + (kind ? ' ' + kind : ''), msg);
	document.getElementById('toasts').appendChild(t);
	setTimeout(() => t.remove(), 5000);
}
const fmt = v => v === null || v === undefined || v === '' ? '' : String(v);
const same = (a, b) => String(a).replace(/[°\s]/g, '').toLowerCase() === String(b).replace(/[°\s]/g, '').toLowerCase();

function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener('mousedown', e => { if (openMenu && !openMenu.contains(e.target) && !e.target.closest('[data-menu-anchor]')) closeMenu(); });
window.addEventListener('scroll', closeMenu, true);

function showMenu(anchor, items, current, onPick) {
	closeMenu();
	if (!items.length) return;
	const m = el('div', 'menu');
	for (const it of items) {
		if (typeof it === 'object' && it.header) { m.appendChild(el('div', 'hdr', it.header)); continue; }
		const d = el('div', typeof it === 'object' && it.text ? 'txt' : '', typeof it === 'object' ? it.label : fmt(it));
		if (typeof it === 'object' && it.suffix) d.appendChild(el('span', 'x', it.suffix));
		const val = typeof it === 'object' ? it.value : it;
		if (current != null && (same(val, current) || (typeof it === 'object' && it.match != null && same(it.match, current)))) d.classList.add('cur');
		d.addEventListener('mousedown', e => { e.preventDefault(); closeMenu(); onPick(val); });
		m.appendChild(d);
	}
	document.body.appendChild(m);
	const r = anchor.getBoundingClientRect();
	m.style.minWidth = r.width + 'px';
	const h = Math.min(m.scrollHeight, 320);
	m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 8) + 'px';
	m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
	const cur = m.querySelector('.cur');
	if (cur) cur.scrollIntoView({ block: 'center' });
	openMenu = m;
}

// A text field with an optional dropdown of camera-supported values.
// Typing a value and pressing Enter (or picking from the menu) commits it.
function combo(param, onCommit) {
	const spec = PARAMS[param];
	const wrap = el('div', 'combo ctl');
	const input = el('input');
	input.spellcheck = false;
	input.autocomplete = 'off';
	if (spec.text) { input.maxLength = 3; input.style.textAlign = 'center'; input.style.textTransform = 'uppercase'; }
	const drop = el('button', 'drop', '▾');
	drop.tabIndex = -1;
	drop.dataset.menuAnchor = '';
	wrap.append(input, drop);
	wrap.options = [];
	wrap.current = null;
	const commit = v => { v = String(v).trim(); if (v === '') return; input.value = v; onCommit(v); input.blur(); };
	input.addEventListener('keydown', e => {
		if (e.key === 'Enter') { e.preventDefault(); commit(input.value); }
		else if (e.key === 'Escape') { input.value = fmt(wrap.current); input.blur(); }
		else if (spec.step && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
			e.preventDefault();
			const base = parseFloat(input.value || wrap.current || 0) || 0;
			input.value = base + (e.key === 'ArrowUp' ? 1 : -1) * spec.step * (e.shiftKey ? 10 : 1);
		}
	});
	input.addEventListener('focus', () => { input.select(); });
	input.addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== input) input.value = fmt(wrap.current); }, 150); });
	drop.addEventListener('mousedown', e => {
		e.preventDefault();
		if (openMenu) { closeMenu(); return; }
		showMenu(wrap, wrap.options, wrap.menuCurrent != null ? wrap.menuCurrent : wrap.current, v => commit(v));
	});
	wrap.input = input;
	wrap.set = (value, options, opts = {}) => {
		wrap.current = value;
		wrap.menuCurrent = opts.menuCurrent;   // what the menu highlights, if not the shown value
		wrap.options = options || [];
		wrap.classList.toggle('noopts', !wrap.options.length);
		wrap.classList.toggle('disabled', !!opts.disabled);
		wrap.classList.toggle('pending', !!opts.pending);
		if (document.activeElement !== input) input.value = opts.disabled && !opts.showValue ? '–' : fmt(value);
		input.title = opts.title || '';
	};
	return wrap;
}

function zoomFactor(mm, main) {
	const f = mm / main;
	if (f < 1) return f.toFixed(1) + '×';
	const r = Math.round(f);
	return (Math.abs(f - r) < 0.35 ? r : Math.round(f * 2) / 2) + '×';
}

function lensOptions(cams) {
	const opts = cams.flatMap(c => c.lensOptions || []);
	if (!opts.length) return [];
	const main = cams.map(c => c.lensMain).find(Boolean);
	if (cams.length === 1 && typeof opts[0] === 'object') {
		// the phone's own lens list: pick a physical lens by id
		// highlighted by lens id (menuCurrent), since two lenses can share a focal length
		return [{ header: 'Lenses' }, ...opts.map(o => o.facing === 'front'
			? { value: o.value, label: o.label || 'Front', suffix: o.mm + ' mm' + (o.zoom ? ' · ' + o.zoom : '') }
			: { value: o.value, label: o.label || o.mm + ' mm', suffix: o.zoom || (main ? zoomFactor(o.mm, main) : '') })];
	}
	// several cameras (global row) or phones without a lens list: focal lengths in mm
	const zoomOf = {};
	for (const o of opts) if (typeof o === 'object' && o.facing !== 'front') zoomOf[o.mm] = o.zoom;
	const mms = [...new Set(opts.map(o => typeof o === 'object' ? (o.facing === 'front' ? null : o.mm) : o).filter(v => v != null))].sort((a, b) => a - b);
	const native = cams.every(c => c.lensNative);
	return [{ header: native ? 'Lenses' : 'Focal lengths' },
		...mms.map(mm => ({ value: mm, label: mm + ' mm', suffix: zoomOf[mm] || (main ? zoomFactor(mm, main) : '') }))];
}

function optionsFor(param, cam) {
	if (param === 'lens') return lensOptions([cam]);
	const spec = PARAMS[param];
	if (spec.opts && cam[spec.opts] && cam[spec.opts].length) return cam[spec.opts];
	return spec.presets || [];
}

// ---------------------------------------------------------------- global row
const globalCtl = {};
function buildGlobalRow() {
	const row = document.getElementById('globalRow');

			// the controller snaps out-of-range values per camera: show what each got

			for (const [id, sent] of Object.entries((res && res.values) || {})) {

	rec.title = 'Start / stop recording on all armed cameras';

	globalCtl.rec = rec;
	row.append(rec, el('div'));
}

function unionOptions(param, cams) {
	if (param === 'lens') return lensOptions(cams);
	const seen = new Map();
	for (const c of cams) for (const o of optionsFor(param, c)) if (!seen.has(String(o))) seen.set(String(o), o);
	const vals = [...seen.values()];
	// numbers, shutter speeds (1/50) and f-stops (f/2.8) sort by value
	const n = x => { const t = String(x); return t.startsWith('1/') ? 1 / parseFloat(t.slice(2)) : parseFloat(t.replace(/^f\//, '')); };
	if (vals.every(v => !isNaN(n(v)))) vals.sort((a, b) => n(a) - n(b));
	return vals;
}

function renderGlobal() {
	const cams = state.cameras;
	const armed = cams.filter(c => c.active);
	const g = globalCtl;
	g.arm.className = 'arm' + (armed.length && armed.length === cams.length ? ' on' : armed.length ? ' some' : '');
	g.meta.textContent = armed.length + ' of ' + cams.length + ' armed';
	for (const p of GLOBAL_PARAMS) {
		const vals = armed.map(c => c[p]).filter(v => v !== null && v !== undefined);
		const allSame = vals.length && vals.every(v => same(v, vals[0]));
		if (p === 'iris') {
			// only cameras with a controllable iris take part
			const irisCams = armed.filter(c => c.irisControllable);
			const iv = irisCams.map(c => c.iris).filter(v => v != null);
			const same1 = iv.length && iv.every(v => same(v, iv[0]));
			g.iris.set(same1 ? iv[0] : '', unionOptions('iris', irisCams), {
				disabled: !irisCams.length,
				title: irisCams.length ? 'Sets the iris on armed cameras that have an adjustable aperture' : 'No armed camera has an adjustable aperture' });
			g.iris.input.placeholder = iv.length && !same1 ? 'mixed' : '—';
			continue;
		}
		g[p].set(allSame ? vals[0] : (vals.length ? '' : ''), unionOptions(p, armed), { title: allSame ? '' : 'Mixed values — type or pick one to override all armed cameras' });
		g[p].input.placeholder = vals.length && !allSame ? 'mixed' : '—';
	}
	const armedRec = armed.some(c => c.recording);
	g.rec.classList.toggle('on', armedRec);
	g.rec.innerHTML = '<span class="led"></span>' + (armedRec ? 'STOP' : 'REC');
	g.rec.disabled = !armed.length;
}

// ---------------------------------------------------------------- camera rows
// A lens is sent as the phone's lens id but shown as mm (or its name for front lenses).
function shownValue(cam, param, value) {
	const lens = param === 'lens' && (cam.lensOptions || []).find(o => typeof o === 'object' && o.value === value);
	return lens ? (lens.facing === 'front' ? (lens.label || 'Front') : lens.mm) : value;
}
function markPending(id, param, value) { pending[id + ':' + param] = { value, since: Date.now(), until: Date.now() + 3500 }; }
function pendingFor(cam, param) {
	const k = cam.id + ':' + param, p = pending[k];
	if (!p) return null;
	const failed = cam.errorTime * 1000 >= p.since - 250;
	if (failed || Date.now() > p.until || same(p.value, cam[param])) { delete pending[k]; return null; }
	return p;
}

// On/off switches show the new state as soon as they're clicked, until the
// camera reports it (confirmed) or the command fails / times out (reverted).
const TOGGLE_TIMEOUT = 6000;
function sendToggle(cam, key, value, path, body) {
	const k = cam.id + ':' + key;
	toggles[k] = { value, since: Date.now(), until: Date.now() + TOGGLE_TIMEOUT };
	api(path, body).catch(e => { if (toggles[k]) toggles[k].failed = true; toast(e.message); });
	renderCams();
}
function toggleState(cam, key, actual) {
	const k = cam.id + ':' + key, t = toggles[k];
	if (!t) return { value: actual };
	if (actual === t.value) { delete toggles[k]; return { value: actual, result: 'confirmed' }; }
	const errored = cam.errorTime * 1000 >= t.since - 250;
	if (t.failed || errored || Date.now() > t.until) {
		delete toggles[k];
		if (!t.failed && !errored) toast((cam.name || cam.address) + ': no confirmation from the camera, switch reverted');
		return { value: actual, result: 'failed' };
	}
	return { value: t.value, sending: true };
}
function paintToggle(btn, st) {
	btn.classList.toggle('sending', !!st.sending);
	if (st.result) {
		btn.classList.remove('confirmed', 'failed');
		void btn.offsetWidth;   // restart the animation
		btn.classList.add(st.result);
		setTimeout(() => btn.classList.remove(st.result), 800);
	}
}

	r.name.addEventListener('change', () => act('/cameras/' + cam.id + '/update', { name: r.name.value }));
	r.chev = el('button', 'chev', '▶');

	r.refresh.addEventListener('click', () => {
		r.refresh.classList.add('spin');

		act('/cameras/' + cam.id + '/refresh');
	});
	const more = el('button', 'btn icon', '⋯');
	more.dataset.menuAnchor = '';
	more.addEventListener('mousedown', e => {
		e.preventDefault();
		if (openMenu) { closeMenu(); return; }
		const items = [
			{ label: 'Auto white balance', value: 'awb', text: true },
			{ label: 'Open live view', value: 'live', text: true },
			...(r.cam.liveOurs || r.cam.liveMode ? [{ label: 'Stop live view (restore format)', value: 'stoplive', text: true }] : []),
			{ label: 'Reconnect', value: 'refresh', text: true },
			{ label: 'Remove camera', value: 'remove', text: true },

		showMenu(more, items, null, v => {

			}
			if (v === 'stoplive') act(base + '/stream', { enabled: false });
			if (v === 'refresh') act(base + '/refresh');

		});

	const tools = el('div', 'tools');

}

// ---------------------------------------------------------------- expanded row (focus)
const EXPANDED_KEY = 'lucam-expanded';
let expanded = new Set();
try { expanded = new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) || '[]')); } catch (e) { /* storage unavailable */ }

function setExpanded(id, open) {
	if (open) expanded.add(id); else expanded.delete(id);
	try { localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expanded])); } catch (e) { /* storage unavailable */ }
	const r = rows.get(id);
	if (r) {
		r.expand.hidden = !open;
		r.chev.classList.toggle('open', open);
		if (open) loadPresets(r);
	}
}

function buildExpand(r, cam) {
	const x = el('div', 'expand');
	x.hidden = !expanded.has(cam.id);
	r.chev.classList.toggle('open', !x.hidden);
	const send = (param, value) => act('/cameras/' + cam.id + '/set', { param, value });

	// Focus position. The phone turns continuous AF off when focus is set.
	const fg = el('div', 'grp');
	r.focus = el('input');
	r.focus.type = 'range'; r.focus.min = 0; r.focus.max = 1000; r.focus.step = 1;
	r.focusVal = el('span', 'val mono');
	let timer = null;
	const sendFocus = () => { timer = null; send('focus', r.focus.value / 1000); };
	r.focus.addEventListener('input', () => {
		r.focusTouched = Date.now();
		r.focusVal.textContent = Math.round(r.focus.value / 10) + '%';
		if (!timer) timer = setTimeout(sendFocus, 120);
	});
	r.focus.addEventListener('change', () => { r.focusTouched = Date.now(); clearTimeout(timer); sendFocus(); });
	fg.append(el('span', 'lbl', 'Focus'), r.focus, r.focusVal);

	// Autofocus: continuous on/off, plus a one-shot focus.
	const ag = el('div', 'grp');
	r.af = el('button', 'switch', 'Autofocus');
	r.af.title = 'Continuous autofocus on/off';
	const sendSwitch = (key, param, value) => sendToggle(r.cam, key, value, '/cameras/' + cam.id + '/set', { param, value });
	r.af.addEventListener('click', () => sendSwitch('autofocus', 'autofocus', !r.afShown));
	r.once = el('button', 'btn', 'Focus once');
	r.once.title = 'Autofocus once, then hold';
	r.once.addEventListener('click', () => send('focusonce', true));
	ag.append(r.af, r.once);

	// Lock: held by the controller (the app has no lock): AF off, focus changes refused.
	const lg = el('div', 'grp');
	r.lock = el('button', 'btn lock');
	r.lock.addEventListener('click', () => sendSwitch('focuslock', 'focuslock', !r.lockShown));
	r.focusNote = el('span', 'note');
	lg.append(r.lock, r.focusNote);

	// Monitoring on/off switches, one per display that has them (screen, HDMI).
	r.lutGroup = el('div', 'grp');
	r.cleanGroup = el('div', 'grp');
	r.monitorSwitches = {};
	x.append(fg, el('span', 'sep'), ag, el('span', 'sep'), lg, el('span', 'row-break'), buildPresets(r, cam),
		el('span', 'sep'), r.lutGroup, el('span', 'sep'), r.cleanGroup, el('span', 'sep'), buildDevice(r));
	r.expand = x;
	r.el.append(x);
	if (!x.hidden) loadPresets(r);
}

// Camera presets (.cset / .bmcpreset files), straight to and from the camera.
function buildPresets(r, cam) {
	const base = '/api/cameras/' + cam.id + '/presets';
	const g = el('div', 'grp');
	r.presetSel = el('select');
	r.presetSel.title = 'Presets stored on the camera';
	const btn = (label, title, fn) => { const b = el('button', 'btn', label); b.title = title; b.addEventListener('click', fn); return b; };
	const selected = () => r.presetSel.value;
	const post = async (action, name) => {
		try { await api('/cameras/' + cam.id + '/presets/' + action, { name }); }
		catch (e) { toast(e.message); }
		loadPresets(r);
	};
	const download = btn('⬇ Download', 'Download the selected preset file', () => {
		if (!selected()) return;
		const a = el('a');
		a.href = base + '/download?name=' + encodeURIComponent(selected());
		a.download = '';
		document.body.append(a); a.click(); a.remove();
	});
	const apply = btn('Apply', 'Make the selected preset active on the camera', () => selected() && post('apply', selected()));
	const del = btn('Delete', 'Delete the selected preset from the camera', () => {
		if (selected() && confirm('Delete preset "' + selected() + '" from ' + (r.cam.name || r.cam.address) + '?')) post('delete', selected());
	});
	const save = btn('Save current…', "Save the camera's current settings as a new preset", () => {
		const d = new Date(), pad = n => String(n).padStart(2, '0');
		const name = prompt('Preset name', (r.cam.name || 'Camera') + ' ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + pad(d.getMinutes()));
		if (name && name.trim()) post('save', name.trim());
	});
	const file = el('input');
	file.type = 'file'; file.accept = '.cset,.bmcpreset'; file.hidden = true;
	file.addEventListener('change', async () => {
		const f = file.files[0];
		file.value = '';
		if (!f) return;
		try {
			const res = await fetch(base + '/upload?filename=' + encodeURIComponent(f.name), { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: f });
			const data = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(data.error || res.statusText);
			toast('Uploaded to ' + (r.cam.name || r.cam.address) + ' as "' + data.presetAdded + '"', 'info');
		} catch (e) { toast('Upload failed: ' + e.message); }
		loadPresets(r);
	});
	const upload = btn('⬆ Upload…', 'Upload a preset file (.cset or .bmcpreset) to the camera', () => file.click());
	r.presetButtons = [download, apply, del];
	r.presetAll = [r.presetSel, download, apply, del, save, upload];
	g.append(el('span', 'lbl', 'Presets'), r.presetSel, download, apply, del, save, upload, file);
	return g;
}

// Phone model and app version (moved here from under the camera name).
function buildDevice(r) {
	const g = el('div', 'grp');
	r.device = el('span', 'note');
	g.append(el('span', 'lbl', 'Device'), r.device);
	return g;
}

const DISPLAY_LABELS = { Device: 'Screen', HDMI: 'HDMI' };
const MONITOR_SWITCHES = [
	{ param: 'displaylut', key: 'displayLuts', group: 'lutGroup', label: 'LUT',
	  title: d => 'Display LUT on the ' + d + ' output (preview only, not recorded)' },
	{ param: 'cleanfeed', key: 'cleanFeeds', group: 'cleanGroup', label: 'HDMI video',
	  name: d => d === 'HDMI' ? 'Clean feed' : d + ' clean feed',
	  title: d => 'Clean feed on the ' + d + ' output: the picture without the app\'s overlays.'
		+ (d === 'HDMI' ? '\nAlso sets the app\'s HDMI output to Video feed (not Mirror display).' : '') },
];
function renderMonitorSwitches(r, cam) {
	for (const m of MONITOR_SWITCHES) {
		const values = cam[m.key] || {};
		const names = Object.keys(values);
		const group = r[m.group];
		group.hidden = !names.length;
		if (!group.firstChild && names.length) group.append(el('span', 'lbl', m.label));
		for (const name of names) {
			const id = m.param + ':' + name;
			let sw = r.monitorSwitches[id];
			if (!sw) {
				sw = el('button', 'switch');
				sw.title = m.title(DISPLAY_LABELS[name] || name);
				sw.addEventListener('click', () => {
					const on = !sw.classList.contains('on');
					sendToggle(r.cam, id, on, '/cameras/' + cam.id + '/set', { param: m.param, value: { display: name, enabled: on } });
				});
				r.monitorSwitches[id] = sw;
				group.append(sw);
			}
			const st = toggleState(cam, id, !!values[name]);
			paintToggle(sw, st);
			sw.classList.toggle('on', st.value);
			sw.textContent = (m.name ? m.name(name) : DISPLAY_LABELS[name] || name) + (st.value ? ' on' : ' off');
			sw.disabled = !cam.online;
		}
	}
}

async function loadPresets(r) {
	if (!r.cam || !r.cam.online) return;
	let data;
	try { data = await api('/cameras/' + r.cam.id + '/presets'); }
	catch (e) {
		r.presetSel.replaceChildren(el('option', '', 'presets unavailable'));
		r.presetCount = 0;   // don't retry on every refresh; reopening the row reloads
		for (const b of r.presetButtons) b.disabled = true;
		return;
	}
	const keep = r.presetSel.value;
	const opts = data.presets.map(name => {
		const o = el('option', '', name + (name === data.active ? '  (active)' : ''));
		o.value = name;
		return o;
	});
	r.presetSel.replaceChildren(...(opts.length ? opts : [el('option', '', 'no presets on camera')]));
	if (opts.length) r.presetSel.value = data.presets.includes(keep) ? keep : (data.active && data.presets.includes(data.active) ? data.active : data.presets[0]);
	r.presetCount = opts.length;
	for (const b of r.presetButtons) b.disabled = !opts.length;
}

function renderExpand(r, cam) {
	const usable = cam.online && cam.focusControllable;
	const lockSt = toggleState(cam, 'focuslock', !!cam.focusLocked);
	const locked = r.lockShown = lockSt.value;
	r.focus.disabled = !usable || locked;
	// don't fight the slider while it's being dragged (or just after)
	if (cam.focus != null && !(r.focusTouched && Date.now() - r.focusTouched < 1500)) {
		r.focus.value = Math.round(cam.focus * 1000);
		r.focusVal.textContent = Math.round(cam.focus * 100) + '%';
	} else if (cam.focus == null && !r.focusTouched) {
		r.focusVal.textContent = '–';
	}
	const afSt = toggleState(cam, 'autofocus', cam.autofocus === 'Continuous');
	const afOn = r.afShown = afSt.value;
	paintToggle(r.af, afSt);
	paintToggle(r.lock, lockSt);
	r.af.classList.toggle('on', afOn);
	r.af.textContent = afOn ? 'Autofocus on' : 'Autofocus off';
	r.af.disabled = !cam.online || !cam.autofocusSupported || locked;
	r.once.disabled = !usable || locked;
	r.lock.classList.toggle('on', locked);
	r.lock.textContent = locked ? '🔒 Focus locked' : '🔓 Lock focus';
	r.lock.disabled = !usable;
	r.lock.title = locked ? 'Unlock focus'
		: 'Turn autofocus off, block focus changes from here and put focus back if the phone moves it.\n'
		+ 'Taps on the phone screen still refocus for about a second: to stop that, also press the lock under the focus slider on the phone (the API can\'t switch it).';
	r.focusNote.textContent = !cam.online ? 'offline' : !cam.focusControllable ? 'focus not controllable on this camera'
		: locked ? 'held at ' + Math.round((cam.focus || 0) * 100) + '% · to stop taps refocusing, also lock focus on the phone'
		: afOn ? 'moving the slider turns autofocus off' : '';
	r.chev.title = 'More controls (focus' + (locked ? ', locked' : afOn ? ', AF on' : '') + ', presets, LUT, clean feed)';
	renderMonitorSwitches(r, cam);
	for (const b of r.presetAll) b.disabled = !cam.online || (r.presetButtons.includes(b) && !r.presetCount);
	if (cam.online && r.presetCount === undefined && !r.expand.hidden && !r.presetLoading) {
		r.presetLoading = true;
		loadPresets(r).finally(() => { r.presetLoading = false; });
	}
}

function codecName(cam, value) {
	const o = (cam.codecOptions || []).find(o => o.value === value);
	return o ? o.label : (value || '').replace('Apple ', '').replace(':Default', '');
}
function resolutionName(cam, value) {
	const o = (cam.resolutionOptions || []).find(o => o.value === value);
	return o ? o.label.split(' · ')[0] || value : value;
}
function formatLabel(cam) {
	if (!cam.codec) return '';
	return [codecName(cam, cam.codec), resolutionName(cam, cam.resolution), cam.colorspace].filter(Boolean).join(' · ');
}

// Recording format editor: resolution first (it decides which codecs exist).
function showFormatPanel(anchor, cam) {
	closeMenu();
	const p = el('div', 'fmtpanel');
	const mkSelect = (label, options, value) => {
		const l = el('label', '', label);
		const sel = el('select');
		for (const o of options) {
			const opt = el('option', '', o.label);
			opt.value = o.value;
			if (o.value === value) opt.selected = true;
			sel.append(opt);
		}
		l.append(sel);
		p.append(l);
		return sel;
	};
	const resSel = mkSelect('Resolution', cam.resolutionOptions || [], cam.resolution);
	const codecSel = mkSelect('Codec', cam.codecOptions || [], cam.codec);
	resSel.addEventListener('change', () => {
		// the camera's codec list depends on resolution; it is refreshed after applying
		codecSel.disabled = resSel.value !== cam.resolution;
	});
	const csOptions = (cam.colorspaceOptions || []).map(v => ({ value: v, label: v }));
	const csSel = csOptions.length ? mkSelect('Colour space', csOptions, cam.colorspace) : null;
	if (!csSel) p.append(el('div', 'hint', 'Colour space: not reported by this camera.'));
	if (cam.liveMode) p.append(el('div', 'hint live', 'In live view: changes are saved and applied when the live view stops or REC starts.'));
	const buttons = el('div', 'buttons');
	const cancel = el('button', 'btn', 'Cancel');
	const apply = el('button', 'btn primary', 'Apply');
	cancel.addEventListener('click', closeMenu);
	apply.addEventListener('click', async () => {
		// one request at a time so the camera worker queues them in this order
		const base = '/cameras/' + cam.id + '/set';
		const changes = [];
		if (resSel.value !== cam.resolution) changes.push({ param: 'resolution', value: resSel.value });
		if (!codecSel.disabled && codecSel.value !== cam.codec) changes.push({ param: 'codec', value: codecSel.value });
		if (csSel && csSel.value !== cam.colorspace) changes.push({ param: 'colorspace', value: csSel.value });
		closeMenu();
		for (const c of changes) await act(base, c);
	});
	buttons.append(cancel, apply);
	p.append(buttons);
	document.body.appendChild(p);
	const r = anchor.getBoundingClientRect();
	p.style.left = Math.min(r.left, innerWidth - p.offsetWidth - 8) + 'px';
	p.style.top = (r.bottom + p.offsetHeight + 8 > innerHeight ? Math.max(8, r.top - p.offsetHeight - 4) : r.bottom + 4) + 'px';
	openMenu = p;
}

function renderRow(r, cam) {
	r.cam = cam;
	const cls = ['row', 'cam'];
	if (!cam.online) cls.push('offline');
	if (!cam.active) cls.push('inactive');
	if (cam.recording) cls.push('recording');
	r.el.className = cls.join(' ');
	r.arm.className = 'arm' + (cam.active ? ' on' : '');
	r.dot.className = 'dot ' + (cam.recording ? 'bad' : cam.online ? 'ok' : cam.connecting ? 'wait' : 'bad');
	r.dot.title = cam.online ? 'online' : cam.connecting ? 'connecting' : 'offline';
	if (document.activeElement !== r.name) r.name.value = cam.name || cam.deviceName || cam.address;
	const device = [cam.product, cam.software && 'app ' + cam.software].filter(Boolean).join(' · ');
	r.meta.textContent = cam.address;
	r.meta.title = [cam.address, device].filter(Boolean).join(' · ');
	r.device.textContent = device || (cam.online ? '…' : '–');
	const fresh = cam.error && (Date.now() / 1000 - cam.errorTime < 20);
	r.err.textContent = cam.liveWarning || (fresh ? cam.error : '');
	r.err.title = cam.liveWarning || cam.error || '';
	const unsupported = new Set(cam.unsupported || []);
	for (const [p, c] of Object.entries(r.ctl)) {
		const pend = pendingFor(cam, p);
		const key = UNSUPPORTED_KEY[p] || p;
		let disabled = unsupported.has(key) || (!cam.online && cam[p] == null);
		let title = unsupported.has(key) ? 'Not supported by this camera' : '';
		let showValue = false;
		if (p === 'iris' && !disabled && !cam.irisControllable) {
			// fixed-aperture iPhones still report their f-number
			disabled = true; showValue = true;
			title = 'Fixed aperture on this camera' + (cam.iris ? ' (' + cam.iris + ')' : '');
		} else if (p === 'iris' && cam.irisAuto) {
			title = 'Iris is currently set by auto exposure';
		}
		const held = (p === 'wb' || p === 'tint') && cam.wbHold && cam.wbHold[p] != null;
		if (held) title = 'Held at ' + cam.wbHold[p] + (p === 'wb' ? 'K' : '') + ': restored if the phone changes it (auto WB or a preset releases it)';
		c.classList.toggle('held', held);
		c.set(pend ? pend.value : cam[p], optionsFor(p, cam), { pending: !!pend, disabled, title, showValue,
			menuCurrent: p === 'lens' ? cam.lensId : undefined });
	}
	const fmtLabel = formatLabel(cam);
	r.fmtMain.textContent = fmtLabel || (cam.online ? '…' : '–');
	r.fmt.classList.toggle('live', !!cam.liveMode);
	r.fmtNote.textContent = cam.liveMode ? 'live: ' + (cam.deviceFormat || 'H.264 HD') + ' · restored on REC' : '';
	r.fmt.title = cam.liveMode
		? 'Real recording format: ' + fmtLabel + '\nNow recording ' + (cam.deviceFormat || '') + ' for the live view. The real format comes back when the live view stops or REC starts.'
		: 'Recording format: ' + fmtLabel;
	r.fmt.disabled = !cam.online || !(cam.resolutionOptions || []).length;
	renderExpand(r, cam);
	r.tc.textContent = cam.timecode || (cam.online ? '' : 'offline');
	// clip names are long (Z001_11022247_C005): allow a line break after each underscore
	const clip = (cam.liveOurs ? '◉ LIVE · ' : '') + (cam.clipName || '');
	if (r.clip.dataset.text !== clip) {
		r.clip.replaceChildren(...clip.split(/(?<=_)/).flatMap((part, i) => i ? [el('wbr'), part] : [part]));
		r.clip.dataset.text = clip;
		r.clip.title = cam.clipName ? 'Next clip: ' + cam.clipName : '';
	}
	r.rec.className = 'btn rec' + (cam.recording ? ' on' : '') + (cam.recordPending ? ' pending' : '');
	r.rec.innerHTML = '<span class="led"></span>' + (cam.recording ? 'STOP' : 'REC');
	r.rec.disabled = !cam.online;
}

function renderCams() {
	const host = document.getElementById('camRows');
	const ids = new Set(state.cameras.map(c => c.id));
	for (const [id, r] of rows) if (!ids.has(id)) { r.el.remove(); rows.delete(id); }
	state.cameras.forEach((cam, i) => {
		let r = rows.get(cam.id);
		if (!r) { r = buildRow(cam); rows.set(cam.id, r); }
		if (host.children[i] !== r.el) host.insertBefore(r.el, host.children[i] || null);
		renderRow(r, cam);
	});
	document.getElementById('emptyMsg').hidden = state.cameras.length > 0;
}

// ---------------------------------------------------------------- discovery
let lastDiscovery = 0;
function renderDiscovery() {
	const d = state.discovery || {};
	const status = document.getElementById('discStatus');
	document.getElementById('discBtn').disabled = document.getElementById('scanBtn').disabled = !!d.running;
	if (d.running) status.textContent = d.mode === 'scan' ? 'Scanning subnet…' : 'Browsing Bonjour…';
	else if (d.error) status.textContent = 'Discovery failed: ' + d.error;
	else if (d.finished) status.textContent = d.results.length ? d.results.length + ' camera(s) found' : 'No cameras found. Is the REST API enabled in the app, and are you on the same network?';
	else status.textContent = '';
	if (d.finished === lastDiscovery && !d.running) {
		// keep "added" flags current without rebuilding
		document.querySelectorAll('#found .item').forEach(item => {
			const r = d.results.find(x => x.address === item.dataset.addr);
			const b = item.querySelector('button');
			if (r && b) { b.disabled = r.added; b.textContent = r.added ? 'Added' : 'Add'; }
		});
		return;
	}
	lastDiscovery = d.finished;
	const box = document.getElementById('found');
	box.textContent = '';
	for (const r of d.results || []) {
		const item = el('div', 'item');
		item.dataset.addr = r.address;
		const info = el('div', 'grow');
		info.append(el('div', '', r.name), el('div', 'meta', [r.address, r.hostname, r.product, r.source].filter(Boolean).join(' · ')));
		const b = el('button', 'btn', r.added ? 'Added' : 'Add');
		b.disabled = r.added;
		b.addEventListener('click', () => { b.disabled = true; act('/cameras/add', { address: r.address, name: r.name }); });
		item.append(info, b);
		box.appendChild(item);
	}
}

// ---------------------------------------------------------------- header
function renderHeader(ok) {
	const cams = state.cameras;
	const online = cams.filter(c => c.online).length;
	const recording = cams.filter(c => c.recording).length;
	document.getElementById('summary').textContent =
		cams.length + ' camera' + (cams.length === 1 ? '' : 's') + ' · ' + online + ' online' + (recording ? ' · ' + recording + ' recording' : '');
	document.getElementById('connDot').className = 'dot ' + (ok ? 'ok' : 'bad');
	document.getElementById('connText').textContent = ok ? 'controller connected' : 'controller unreachable';
	const live = cams.filter(c => c.liveMode || c.liveOurs).length;
	const stopLive = document.getElementById('stopLive');
	stopLive.disabled = !live;
	stopLive.textContent = '■ Stop all lives' + (live ? ' (' + live + ')' : '');
	const recAll = document.getElementById('recAll');
	recAll.classList.toggle('on', state.anyRecording);
	recAll.disabled = !cams.some(c => c.active && c.online);
}

// ---------------------------------------------------------------- loop
let failures = 0;
async function poll() {
	try {
		state = await api('/state');
		failures = 0;
		renderHeader(true);
		renderGlobal();
		renderCams();
		renderDiscovery();
	} catch (e) {
		if (++failures > 2) renderHeader(false);
	}
	setTimeout(poll, 350);
}

document.getElementById('stopLive').addEventListener('click', () => act('/global/stoplive'));
document.getElementById('recAll').addEventListener('click', () => act('/global/record', { recording: true }));
document.getElementById('stopAll').addEventListener('click', () => act('/global/record', { recording: false }));
document.getElementById('addBtn').addEventListener('click', addCam);
document.getElementById('addAddr').addEventListener('keydown', e => { if (e.key === 'Enter') addCam(); });
document.getElementById('discBtn').addEventListener('click', () => act('/discover', { mode: 'bonjour' }));
document.getElementById('scanBtn').addEventListener('click', () => act('/discover', { mode: 'scan' }));
function addCam() {
	const a = document.getElementById('addAddr'), n = document.getElementById('addName');
	if (!a.value.trim()) { a.focus(); return; }
	api('/cameras/add', { address: a.value, name: n.value }).then(() => { a.value = ''; n.value = ''; }).catch(e => toast(e.message));
}

// ---------------------------------------------------------------- network interface
const ifaceLabel = i => i.label + ' · ' + i.name + ' · ' + i.ip + '/' + i.prefix + (i.vpn ? ' (VPN)' : '');
async function loadNetwork() {
	let n;
	try { n = await api('/network'); } catch (e) { return; }
	const sel = document.getElementById('netSelect');
	if (document.activeElement !== sel) {
		const opts = [{ value: 'auto', label: 'Auto: all networks (VPNs skipped for discovery)' }]
			.concat(n.interfaces.map(i => ({ value: i.name, label: ifaceLabel(i) })));
		if (!n.selectedConnected) opts.push({ value: n.selected, label: n.selected + ': not connected' });
		sel.replaceChildren(...opts.map(o => { const e = el('option', '', o.label); e.value = o.value; return e; }));
		sel.value = n.selected;
	}
	const chosen = n.interfaces.find(i => i.name === n.selected);
	document.getElementById('netHint').textContent = !n.selectedConnected
		? n.selected + ' is not connected: discovery will fail until it is back, or pick another interface.'
		: chosen ? 'Discovery searches ' + chosen.network + ' only. Cameras on it stream their live view to ' + chosen.ip + '.'
		: 'Discovery searches every network except VPNs. Live view uses the address each camera is routed through.';
	document.getElementById('netHint').className = 'hint' + (n.selectedConnected ? '' : ' warn');

	const port = n.port || location.port || 80;
	const urlIfaces = chosen ? [chosen] : n.interfaces.filter(i => !i.vpn);
	const urls = document.getElementById('netUrls');
	urls.replaceChildren(...urlIfaces.map(i => {
		const a = el('a', 'mono', 'http://' + i.ip + ':' + port);
		a.href = 'http://' + i.ip + ':' + port; a.target = '_blank';
		a.title = i.label + ' (' + i.name + ')';
		return a;
	}));
	if (!urlIfaces.length) urls.textContent = '–';

	const cams = document.getElementById('netCams');
	cams.replaceChildren(...n.cameras.map(c => {
		const off = chosen && c.interface && c.interface !== chosen.name;
		const s = el('span', off ? 'warn' : '', c.camera + ' → ' + (c.label ? c.label + ' (' + c.interface + ')' : 'no local route') + (off ? ' — not on the selected interface' : ''));
		s.title = c.host + (c.localIp ? ' · this Mac: ' + c.localIp : '');
		return s;
	}));
	if (!n.cameras.length) cams.textContent = 'no cameras yet';
}
document.getElementById('netSelect').addEventListener('change', async e => {
	try { await api('/network', { interface: e.target.value }); } catch (err) { toast(err.message); }
	e.target.blur();
	loadNetwork();
});
document.getElementById('netRefresh').addEventListener('click', loadNetwork);

buildGlobalRow();
poll();
loadNetwork();
setInterval(loadNetwork, 10000);
</script>
